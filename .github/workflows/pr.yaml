name: pr

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  packages: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache turbo artifacts
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Setup pnpm and install
        uses: ./.github/actions/setup-pnpm

      - name: Lint
        run: pnpm turbo run lint

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache turbo artifacts
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Setup pnpm and install
        uses: ./.github/actions/setup-pnpm

      - name: Format check
        run: pnpm run fmt:check

  tsc:
    name: tsc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache turbo artifacts
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Setup pnpm and install
        uses: ./.github/actions/setup-pnpm

      - name: Typecheck
        run: pnpm turbo run tsc

  test-unit:
    name: test-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache turbo artifacts
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Setup pnpm and install
        uses: ./.github/actions/setup-pnpm

      - name: Unit tests
        run: pnpm turbo run test:unit

  test-integration:
    name: test-integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: agent
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache turbo artifacts
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Setup pnpm and install
        uses: ./.github/actions/setup-pnpm

      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgresql://agent:agent@127.0.0.1:5432/agent
        run: pnpm turbo run test:integration --only

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache turbo artifacts
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Setup pnpm and install
        uses: ./.github/actions/setup-pnpm

      - name: Build
        run: pnpm turbo run build

  verify-effect-diagnostics:
    name: verify-effect-diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm and install
        uses: ./.github/actions/setup-pnpm
      - name: Verify clean and failing compiler runs without Turbo
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from "node:child_process";
          import { existsSync, mkdtempSync, rmSync, writeFileSync } from "node:fs";
          import { tmpdir } from "node:os";
          import { join } from "node:path";
          
          const temporary = mkdtempSync(join(tmpdir(), "nopeus-diagnostics-"));
          let checkNumber = 0;
          function check(directory, expectDiagnostic) {
            const result = spawnSync("pnpm", ["exec", "tsc", "--noEmit", "--pretty", "false",
              "--tsBuildInfoFile", join(temporary, String(checkNumber++) + ".tsbuildinfo")],
              { cwd: directory, encoding: "utf8", timeout: 120000 });
            if (result.error) throw result.error;
            const output = result.stdout + result.stderr;
            process.stdout.write(directory + ": exit " + result.status + "\n" + output);
            if (expectDiagnostic) {
              if (result.status === null || result.status === 0 ||
                  !output.includes("__nopeus_diagnostic_probe__.ts(2,1): error TS377001")) {
                throw new Error("Expected floatingEffect diagnostic and failing exit code");
              }
            } else if (result.status !== 0) {
              throw new Error("Clean typecheck failed");
            }
          }
          try {
            for (const directory of ["packages/core", "programs/goho-cli"]) {
              check(directory, false);
              const fixture = join(directory, "src", "__nopeus_diagnostic_probe__.ts");
              if (existsSync(fixture)) throw new Error("Probe path already exists");
              writeFileSync(fixture, 'import { Effect } from "effect";\nEffect.log("discarded diagnostic probe");\n');
              try {
                check(directory, true);
              } finally {
                rmSync(fixture);
              }
              check(directory, false);
              process.stdout.write("PASS: " + directory + " clean -> floatingEffect failure -> clean\n");
            }
          } finally {
            rmSync(temporary, { recursive: true, force: true });
          }
          JS
