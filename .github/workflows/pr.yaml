name: pr

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  packages: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache turbo artifacts
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Setup pnpm and install
        uses: ./.github/actions/setup-pnpm

      - name: Lint
        run: pnpm turbo run lint

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache turbo artifacts
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Setup pnpm and install
        uses: ./.github/actions/setup-pnpm

      - name: Format check
        run: pnpm run fmt:check

  tsc:
    name: tsc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache turbo artifacts
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Setup pnpm and install
        uses: ./.github/actions/setup-pnpm

      - name: Typecheck
        run: pnpm turbo run tsc

  test-unit:
    name: test-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache turbo artifacts
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Setup pnpm and install
        uses: ./.github/actions/setup-pnpm

      - name: Unit tests
        run: pnpm turbo run test:unit

  test-integration:
    name: test-integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: agent
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache turbo artifacts
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Setup pnpm and install
        uses: ./.github/actions/setup-pnpm

      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgresql://agent:agent@127.0.0.1:5432/agent
        run: pnpm turbo run test:integration --only

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache turbo artifacts
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Setup pnpm and install
        uses: ./.github/actions/setup-pnpm

      - name: Build
        run: pnpm turbo run build

  verify-direct-tsconfig:
    name: verify-direct-tsconfig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          registry-url: https://npm.pkg.github.com
          scope: "@adamaho"
      - name: Install and regenerate lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --no-frozen-lockfile
      - name: Export generated lockfile
        run: node -e 'process.stdout.write("LOCKFILE_BASE64=" + require("node:fs").readFileSync("pnpm-lock.yaml").toString("base64") + "\n")'
      - name: Verify direct preset and root compiler patch
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from "node:child_process";
          import { existsSync, mkdtempSync, rmSync, writeFileSync } from "node:fs";
          import { tmpdir } from "node:os";
          import { join } from "node:path";
          const temporary = mkdtempSync(join(tmpdir(), "nopeus-direct-"));
          let count = 0;
          function check(directory, bad) {
            const r = spawnSync("pnpm", ["exec", "tsc", "--noEmit", "--pretty", "false", "--tsBuildInfoFile", join(temporary, String(count++) + ".tsbuildinfo")], {cwd: directory, encoding:"utf8", timeout:120000});
            if (r.error) throw r.error;
            const output = r.stdout + r.stderr;
            process.stdout.write(directory + ": exit " + r.status + "\n" + output);
            if (bad ? r.status === null || r.status === 0 || !output.includes("error TS377001") : r.status !== 0) throw new Error("Unexpected compiler result");
          }
          const isTemplate = !existsSync("packages/core");
          let template;
          try {
            if (isTemplate) {
              template = mkdtempSync("./nopeus-diagnostic-probe-");
              writeFileSync(join(template, "tsconfig.json"), JSON.stringify({extends:"@adamaho/nopeus-tsconfig/effect",compilerOptions:{module:"NodeNext",moduleResolution:"NodeNext",incremental:true},include:["*.ts"]}));
            }
            for (const directory of isTemplate ? [template] : ["packages/core", "programs/goho-cli"]) {
              const fixture = join(directory, isTemplate ? "__nopeus_probe__.ts" : "src/__nopeus_probe__.ts");
              if (existsSync(fixture)) throw new Error("Probe already exists");
              writeFileSync(fixture, 'import { Effect } from "effect";\nexport const retained = Effect.log("retained");\n');
              try {
                check(directory, false);
                writeFileSync(fixture, 'import { Effect } from "effect";\nEffect.log("discarded");\n');
                check(directory, true);
                writeFileSync(fixture, 'import { Effect } from "effect";\nexport const retained = Effect.log("retained");\n');
                check(directory, false);
              } finally { rmSync(fixture); }
              if (!isTemplate) check(directory, false);
              process.stdout.write("PASS direct preset and root compiler patch: " + directory + "\n");
            }
          } finally {
            if (template) rmSync(template, {recursive:true,force:true});
            rmSync(temporary, {recursive:true,force:true});
          }
          JS
