name: deploy

# Deploys every program a push to dev affects, one parallel job per program,
# by running its Turborepo `deploy` task.
# A program opts in by defining a `deploy` script; see infra/README.md.
# This repository is public: the server's address and Tailscale credentials come
# only from the production environment's secrets, and nothing here prints them.

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      programs: ${{ steps.plan.outputs.programs }}
    env:
      TURBO_SCM_BASE: ${{ github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
      # A manual run deploys every program; a push deploys only affected ones.
      TURBO_SELECTION: ${{ github.event_name == 'push' && '--affected' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm and install
        uses: ./.github/actions/setup-pnpm

      - name: Identify programs to deploy
        id: plan
        run: |
          programs="$(pnpm turbo run deploy $TURBO_SELECTION --dry=json |
            jq -c '[.tasks[] | select(.task == "deploy" and .command != "<NONEXISTENT>") | .package]')"
          echo "programs=$programs" >> "$GITHUB_OUTPUT"
          printf 'Programs to deploy: %s\n' "$programs"

  deploy:
    name: deploy ${{ matrix.program }}
    needs: plan
    if: needs.plan.outputs.programs != '[]'
    runs-on: ubuntu-latest
    # Restrict this environment to the dev branch in the repository settings.
    environment: production
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        program: ${{ fromJSON(needs.plan.outputs.programs) }}
    env:
      GOHO_IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
      GOHO_DEPLOY_HOST: ${{ secrets.GOHO_DEPLOY_HOST }}
      PROGRAM: ${{ matrix.program }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and install
        uses: ./.github/actions/setup-pnpm

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:goho-ci
          log-mode: quiet

      # Each program logs in with its own Docker config, so parallel deploys
      # never log each other out. The job token expires when this run ends,
      # so the server keeps no long-lived registry credential.
      - name: Log the server in to the registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" |
            ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR "goho@$GOHO_DEPLOY_HOST" \
              "DOCKER_CONFIG=/opt/goho/${PROGRAM#@goho/}/.docker docker login ghcr.io --username '$REGISTRY_USER' --password-stdin" >/dev/null

      - name: Deploy
        run: pnpm turbo run deploy --filter="$PROGRAM"

      - name: Log the server out of the registry
        if: always()
        run: |
          ssh -o BatchMode=yes -o LogLevel=ERROR "goho@$GOHO_DEPLOY_HOST" \
            "DOCKER_CONFIG=/opt/goho/${PROGRAM#@goho/}/.docker docker logout ghcr.io" >/dev/null || true
