name: deploy

# Builds the goho-server image and deploys it to the Goho server over Tailscale.
# This repository is public: the server's address and Tailscale credentials come
# only from the production environment's secrets, and nothing here prints them.

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/goho-server

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.affected.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm and install
        uses: ./.github/actions/setup-pnpm

      # @goho/infra-deployment depends on goho-server, so Turbo marks it affected
      # when the server, its workspace dependencies or the deployment files change.
      - name: Check whether the deployment is affected
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          TURBO_SCM_BASE: ${{ github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count="$(pnpm turbo ls --affected --filter=@goho/infra-deployment --output=json | jq '.packages.count')"
          if [[ "$count" -gt 0 ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: image
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: programs/goho-server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy
    needs: image
    runs-on: ubuntu-latest
    # Restrict this environment to the dev branch in the repository settings.
    environment: production
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:goho-ci
          log-mode: quiet

      - name: Deploy
        env:
          DEPLOY_TARGET: goho@${{ secrets.GOHO_DEPLOY_HOST }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGE_REF: ${{ env.IMAGE }}:${{ github.sha }}
        run: |
          ssh_options=(-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR)
          # The job token expires when this run ends, so the server keeps no long-lived registry credential.
          printf '%s' "$REGISTRY_TOKEN" |
            ssh "${ssh_options[@]}" "$DEPLOY_TARGET" "docker login ghcr.io --username '$REGISTRY_USER' --password-stdin" >/dev/null
          ssh "${ssh_options[@]}" "$DEPLOY_TARGET" 'cat > /opt/goho/compose.yml' < infra/deployment/docker/compose.yml
          ssh "${ssh_options[@]}" "$DEPLOY_TARGET" bash -s -- "$IMAGE_REF" < infra/deployment/docker/deploy.sh

      - name: Log out of the registry on the server
        if: always()
        env:
          DEPLOY_TARGET: goho@${{ secrets.GOHO_DEPLOY_HOST }}
        run: ssh -o BatchMode=yes -o LogLevel=ERROR "$DEPLOY_TARGET" 'docker logout ghcr.io' >/dev/null || true
