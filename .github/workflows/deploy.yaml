name: deploy

# Runs the Turborepo `deploy` task of every program a push to dev affects.
# A program opts in by defining a `deploy` script; see infra/deployment/README.md.
# This repository is public: the server's address and Tailscale credentials come
# only from the production environment's secrets, and nothing here prints them.

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    # Restrict this environment to the dev branch in the repository settings.
    environment: production
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      GOHO_IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
      TURBO_SCM_BASE: ${{ github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
      # A manual run deploys every program; a push deploys only affected ones.
      TURBO_SELECTION: ${{ github.event_name == 'push' && '--affected' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm and install
        uses: ./.github/actions/setup-pnpm

      - name: Find programs to deploy
        id: plan
        run: |
          programs="$(pnpm turbo run deploy $TURBO_SELECTION --dry=json |
            jq -r '[.tasks[] | select(.command != "<NONEXISTENT>") | .package] | join(" ")')"
          echo "programs=$programs" >> "$GITHUB_OUTPUT"
          printf 'Programs to deploy: %s\n' "${programs:-none}"

      - name: Setup Docker Buildx
        if: steps.plan.outputs.programs != ''
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.plan.outputs.programs != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Connect to Tailscale
        if: steps.plan.outputs.programs != ''
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:goho-ci
          log-mode: quiet

      - name: Log the server in to the registry
        if: steps.plan.outputs.programs != ''
        env:
          GOHO_DEPLOY_HOST: ${{ secrets.GOHO_DEPLOY_HOST }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        # The job token expires when this run ends, so the server keeps no long-lived registry credential.
        run: |
          printf '%s' "$REGISTRY_TOKEN" |
            ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR "goho@$GOHO_DEPLOY_HOST" \
              "docker login ghcr.io --username '$REGISTRY_USER' --password-stdin" >/dev/null

      - name: Deploy
        if: steps.plan.outputs.programs != ''
        env:
          GOHO_DEPLOY_HOST: ${{ secrets.GOHO_DEPLOY_HOST }}
        run: pnpm turbo run deploy $TURBO_SELECTION

      - name: Log the server out of the registry
        if: always() && steps.plan.outputs.programs != ''
        env:
          GOHO_DEPLOY_HOST: ${{ secrets.GOHO_DEPLOY_HOST }}
        run: ssh -o BatchMode=yes -o LogLevel=ERROR "goho@$GOHO_DEPLOY_HOST" 'docker logout ghcr.io' >/dev/null || true
