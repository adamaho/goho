name: setup-pnpm
description: Setup the pinned Node.js and pnpm versions and install locked dependencies.

runs:
  using: composite
  steps:
    - name: Setup pnpm and Node.js
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        runtime: node@24.15.0
        cache: true
        require-lockfile: true
        install: false

    - name: Install dependencies
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
      run: |
        npm_user_config="$(mktemp)"
        trap 'rm -f "$npm_user_config"' EXIT
        chmod 0600 "$npm_user_config"
        printf '%s\n' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$npm_user_config"
        NPM_CONFIG_USERCONFIG="$npm_user_config" pnpm install --frozen-lockfile
