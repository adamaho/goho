packages:
  - clients/*
  - programs/*
  - packages/*
  - tools/*
  - infra/*

allowBuilds:
  esbuild: true
  fallow: true
  msgpackr-extract: true

catalog:
  "@effect/sql-pg": 4.0.0-rc.117
  "@effect/vitest": 4.0.0-rc.117
  vitest: 5.0.1
  "@adamaho/nopeus-oxlint-config": 0.5.0
  "@adamaho/nopeus-oxlint-plugin": 0.8.0
  "@adamaho/nopeus-tsconfig": 0.3.1
  "@effect/ai-openai": 4.0.0-rc.117
  "@effect/platform-node": 4.0.0-rc.117
  "@effect/tsgo": 0.45.0
  "@types/node": 24.13.6
  effect: 4.0.0-rc.117
  oxfmt: 0.70.0
  oxlint: 1.85.0
  rimraf: 6.1.3
  turbo: 2.11.4
  typescript: 7.0.2

catalogMode: strict

saveExact: true
engineStrict: true

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - "@adamaho/nopeus-oxlint-config"
  - "@adamaho/nopeus-oxlint-plugin"
  - "@adamaho/nopeus-tsconfig"
