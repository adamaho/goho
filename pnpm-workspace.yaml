packages:
  - clients/*
  - programs/*
  - packages/*
  - tools/*
  - infra/*

allowBuilds:
  esbuild: true
  fallow: true
  msgpackr-extract: true

catalog:
  "@effect/vitest": 4.0.0-rc.111
  vitest: 4.1.11
  "@adamaho/nopeus-oxlint-config": "gh:0.3.0"
  "@adamaho/nopeus-oxlint-plugin": "gh:0.4.0"
  "@adamaho/nopeus-tsconfig": "gh:0.2.0"
  "@effect/ai-openai": 4.0.0-rc.111
  "@effect/platform-node": 4.0.0-rc.111
  "@effect/tsgo": 0.41.0
  "@googleapis/drive": 21.0.0
  "@googleapis/sheets": 14.0.0
  "@types/node": 24.13.3
  effect: 4.0.0-rc.111
  google-auth-library: 11.0.2
  oxfmt: 0.64.0
  oxlint: 1.79.0
  rimraf: 6.1.3
  turbo: 2.10.11
  typescript: 7.0.2

catalogMode: strict

saveExact: true
engineStrict: true
pmOnFail: error

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false

# These first-party packages are published deliberately and GitHub Packages does
# not expose publish times. Keep exceptions narrow rather than excluding @adamaho/*.
minimumReleaseAgeExclude:
  - "@adamaho/nopeus-oxlint-config"
  - "@adamaho/nopeus-oxlint-plugin"
  - "@adamaho/nopeus-tsconfig"
