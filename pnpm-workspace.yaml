packages:
  - clients/*
  - programs/*
  - packages/*
  - tools/*
  - infra/*

allowBuilds:
  esbuild: true
  fallow: true
  msgpackr-extract: true

catalog:
  "@effect/sql-pg": 4.0.0-rc.116
  "@effect/vitest": 4.0.0-rc.116
  vitest: 5.0.1
  "@adamaho/nopeus-oxlint-config": 0.4.0
  "@adamaho/nopeus-oxlint-plugin": 0.7.0
  "@adamaho/nopeus-tsconfig": 0.3.0
  "@effect/ai-openai": 4.0.0-rc.116
  "@effect/platform-node": 4.0.0-rc.116
  "@effect/tsgo": 0.41.0
  "@googleapis/drive": 22.0.0
  "@googleapis/sheets": 14.0.0
  "@types/node": 24.13.3
  effect: 4.0.0-rc.116
  google-auth-library: 11.0.2
  oxfmt: 0.66.0
  oxlint: 1.81.0
  rimraf: 6.1.3
  turbo: 2.10.12
  typescript: 7.0.2

catalogMode: strict

saveExact: true
engineStrict: true

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - "@adamaho/nopeus-oxlint-config"
  - "@adamaho/nopeus-oxlint-plugin"
  - "@adamaho/nopeus-tsconfig"
