packages:
  - clients/*
  - programs/*
  - packages/*
  - tools/*
  - infra/*

allowBuilds:
  esbuild: true
  fallow: true
  msgpackr-extract: true

catalog:
  "@effect/sql-pg": 4.0.0
  "@effect/vitest": 4.0.0
  vitest: 5.0.3
  "@adamaho/nopeus-oxlint-config": 0.5.0
  "@adamaho/nopeus-oxlint-plugin": 0.9.0
  "@adamaho/nopeus-tsconfig": 0.3.2
  "@effect/ai-openai": 4.0.0
  "@effect/platform-node": 4.0.0
  "@effect/tsgo": 0.47.2
  "@types/node": 24.19.0
  effect: 4.0.0
  oxfmt: 0.71.0
  oxlint: 1.86.0
  rimraf: 6.1.3
  turbo: 2.11.6
  typescript: 7.0.2

catalogMode: strict

saveExact: true
engineStrict: true

# Disable the release-age gate so stable Effect releases can be installed immediately.
minimumReleaseAge: 0
