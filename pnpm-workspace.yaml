packages:
  - clients/*
  - programs/*
  - packages/*
  - tools/*
  - infra/*

allowBuilds:
  esbuild: true
  fallow: true
  msgpackr-extract: true

catalog:
  "@adamaho/nopeus-oxfmt-config": 0.2.0
  "@effect/sql-pg": 4.0.6
  "@effect/vitest": 4.0.6
  vitest: 5.0.5
  "@adamaho/nopeus-oxlint-config": 0.6.0
  "@adamaho/nopeus-oxlint-plugin": 0.11.0
  "@adamaho/nopeus-tsconfig": 0.3.2
  "@effect/ai-openai": 4.0.6
  "@effect/platform-node": 4.0.6
  "@effect/tsgo": 0.57.0
  "@types/node": 24.19.2
  effect: 4.0.6
  oxfmt: 0.74.0
  oxlint: 1.89.0
  rimraf: 6.1.3
  turbo: 2.11.10
  typescript: 7.0.2

catalogMode: strict

saveExact: true
engineStrict: true

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - "@adamaho/*"
