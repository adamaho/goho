# Production stack for the Goho server. infra/deployment/scripts/deploy.sh copies
# this file to /opt/goho/goho-server/compose.yml. POSTGRES_PASSWORD comes from
# /opt/goho/goho-server/.env, a link to /etc/goho/postgres.env. The project and
# Postgres service match infra/deployment/goho-postgres so the existing data
# volume is reused.
name: goho-deployment

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: goho
      POSTGRES_USER: goho
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in /opt/goho/goho-server/.env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  server:
    image: ${GOHO_IMAGE:?Set GOHO_IMAGE to the image to deploy}
    restart: unless-stopped
    init: true
    user: "${GOHO_UID:?Set GOHO_UID}:${GOHO_GID:?Set GOHO_GID}"
    env_file: /etc/goho/server.env
    environment:
      GOHO_SERVER_HOST: 0.0.0.0
      GOHO_SERVER_PORT: "13000"
      GOHO_UPLOADS_DIRECTORY: /var/lib/goho/receipt-uploads
      # The password must be URL-safe; the installer generates a hex token.
      DATABASE_URL: postgresql://goho:${POSTGRES_PASSWORD}@postgres:5432/goho
    ports:
      # Only this machine can reach the API; Tailscale Serve publishes it to the tailnet.
      - "127.0.0.1:13000:13000"
    volumes:
      - ${GOHO_UPLOADS_HOST_DIRECTORY:-/var/lib/goho/receipt-uploads}:/var/lib/goho/receipt-uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:13000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  postgres_data:
