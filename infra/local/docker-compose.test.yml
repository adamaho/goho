name: goho-test

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: goho_test
      POSTGRES_USER: goho_test
      POSTGRES_PASSWORD: goho_test
    ports:
      - "127.0.0.1:${GOHO_TEST_POSTGRES_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
